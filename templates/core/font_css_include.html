{% load static %}
{% if fonts %}
<style>
{% for font in fonts %}
{% if font.font_file %}
@font-face {
    font-family: '{{ font.family_name }}';
    src: url('{{ font.font_file.url }}') format('{% if font.font_format == "ttf" %}truetype{% elif font.font_format == "woff" %}woff{% elif font.font_format == "woff2" %}woff2{% elif font.font_format == "eot" %}embedded-opentype{% elif font.font_format == "otf" %}opentype{% else %}{{ font.font_format }}{% endif %}');
    font-weight: {{ font.font_weight }};
    font-style: normal;
    font-display: swap;
}
{% endif %}
{% endfor %}

{% if default_font %}
/* اعمال فونت پیش‌فرض به کل سیستم */
body, 
.system-font,
.navbar,
.sidebar,
.card,
.btn,
.form-control,
.form-select,
.form-label,
.breadcrumb,
.alert,
.table,
.modal,
.dropdown-menu {
    font-family: '{{ default_font.family_name }}', 'Tahoma', 'Arial', sans-serif !important;
}

/* حفظ فونت‌های خاص - Font Awesome */
.fa, .fas, .far, .fal, .fab, .fad, .fat, .fass, .fasr, .fasl {
    font-family: "Font Awesome 6 Free", "Font Awesome 6 Pro", "Font Awesome 5 Free", "Font Awesome 5 Pro" !important;
    font-style: normal !important;
    font-variant: normal !important;
    text-rendering: auto !important;
    line-height: 1 !important;
}

/* حفظ فونت‌های مونوسپیس */
code, pre, .code, .font-monospace {
    font-family: 'Courier New', Courier, monospace !important;
}
{% endif %}
</style>
{% endif %}
