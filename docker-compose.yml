version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: budgets_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-budgets_db}
      POSTGRES_USER: ${DB_USER:-budgets_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    networks:
      - budgets_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-budgets_user} -d ${DB_NAME:-budgets_db}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: budgets_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - budgets_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Django Application
  web:
    build: .
    container_name: budgets_web
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-budgets_db}
      - DB_USER=${DB_USER:-budgets_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - budgets_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: budgets_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    networks:
      - budgets_network

  # Celery Worker for background tasks (Disabled for now)
  # celery:
  #   build: .
  #   container_name: budgets_celery
  #   restart: unless-stopped
  #   command: celery -A BudgetsSystem worker -l info
  #   environment:
  #     - DEBUG=${DEBUG:-False}
  #     - SECRET_KEY=${SECRET_KEY}
  #     - DB_NAME=${DB_NAME:-budgets_db}
  #     - DB_USER=${DB_USER:-budgets_user}
  #     - DB_PASSWORD=${DB_PASSWORD}
  #     - DB_HOST=db
  #     - DB_PORT=5432
  #     - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
  #   volumes:
  #     - ./logs:/app/logs
  #   depends_on:
  #     - db
  #     - redis
  #   networks:
  #     - budgets_network

  # Celery Beat for scheduled tasks (Disabled for now)
  # celery-beat:
  #   build: .
  #   container_name: budgets_celery_beat
  #   restart: unless-stopped
  #   command: celery -A BudgetsSystem beat -l info
  #   environment:
  #     - DEBUG=${DEBUG:-False}
  #     - SECRET_KEY=${SECRET_KEY}
  #     - DB_NAME=${DB_NAME:-budgets_db}
  #     - DB_USER=${DB_USER:-budgets_user}
  #     - DB_PASSWORD=${DB_PASSWORD}
  #     - DB_HOST=db
  #     - DB_PORT=5432
  #     - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
  #   volumes:
  #     - ./logs:/app/logs
