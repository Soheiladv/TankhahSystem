  #     - db
  #     - redis
  #   networks:
  #     - budgets_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  budgets_network:
    driver: bridge

secrets:
  db_password:
    file: ${DB_PASSWORD_SECRET_FILE:-./secrets/db_password.txt}
  redis_password:
    file: ${REDIS_PASSWORD_SECRET_FILE:-./secrets/redis_password.txt}
  django_secret_key:
    file: ${SECRET_KEY_FILE_PATH:-./secrets/django_secret_key.txt}
