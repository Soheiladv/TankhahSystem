  #     - db
  #     - redis
  #   networks:
  #     - budgets_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  budgets_network:
    driver: bridge
