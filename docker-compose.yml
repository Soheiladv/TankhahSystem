services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: budgets_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tankhasystem}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backups:/backups
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    secrets:
      - db_password
    ports:
      - "3307:3306"
    networks:
      - budgets_network
    healthcheck:
      test:
        - CMD-SHELL
        - |
          DB_PASS=$(cat /run/secrets/db_password) && mysqladmin ping -h localhost -uroot -p"$DB_PASS"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: budgets_redis
    restart: unless-stopped
    command: >
      /bin/sh -c "REDIS_PASS=$(cat /run/secrets/redis_password) &&
      exec redis-server --appendonly yes --requirepass $$REDIS_PASS"
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - budgets_network
    healthcheck:
      test:
        - CMD-SHELL
        - |
          REDIS_PASS=$(cat /run/secrets/redis_password) && redis-cli -a "$REDIS_PASS" ping
      interval: 30s
      timeout: 10s
      retries: 5
    secrets:
      - redis_password

  # Django Application
  web:
    build: .
    container_name: budgets_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - DB_NAME=${DB_NAME:-budgets_db}
      - DB_USER=${DB_USER:-budgets_user}
      - DB_HOST=db
      - DB_PORT=3306
      - DATABASE_DEFAULT_NAME=${DB_NAME:-budgets_db}
      - DATABASE_DEFAULT_USER=${DB_USER:-budgets_user}
      - DATABASE_DEFAULT_HOST=db
      - DATABASE_DEFAULT_PORT=3306
      - SECRET_KEY_FILE=/run/secrets/django_secret_key
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - budgets_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    secrets:
      - db_password
      - redis_password
      - django_secret_key

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: budgets_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    networks:
      - budgets_network

  # Celery Worker for background tasks (Disabled for now)
  # celery:
  #   build: .
  #   container_name: budgets_celery
  #   restart: unless-stopped
  #   command: celery -A BudgetsSystem worker -l info
  #   environment:
  #     - DEBUG=${DEBUG:-False}
  #     - SECRET_KEY=${SECRET_KEY}
  #     - DB_NAME=${DB_NAME:-budgets_db}
  #     - DB_USER=${DB_USER:-budgets_user}
  #     - DB_PASSWORD=${DB_PASSWORD}
  #     - DB_HOST=db
  #     - DB_PORT=5432
  #     - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
  #   volumes:
  #     - ./logs:/app/logs
  #   depends_on:
  #     - db
  #     - redis
  #   networks:
  #     - budgets_network

  # Celery Beat for scheduled tasks (Disabled for now)
  # celery-beat:
  #   build: .
  #   container_name: budgets_celery_beat
  #   restart: unless-stopped
  #   command: celery -A BudgetsSystem beat -l info
  #   environment:
  #     - DEBUG=${DEBUG:-False}
  #     - SECRET_KEY=${SECRET_KEY}
  #     - DB_NAME=${DB_NAME:-budgets_db}
  #     - DB_USER=${DB_USER:-budgets_user}
  #     - DB_PASSWORD=${DB_PASSWORD}
  #     - DB_HOST=db
