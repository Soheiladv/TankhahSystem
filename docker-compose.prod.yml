services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: budgets_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - budgets_network
    healthcheck:
      test:
        - CMD-SHELL
        - |
          DB_PASS=$(cat /run/secrets/db_password) && pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost -p 5432 && PGPASSWORD="$DB_PASS" psql -U ${DB_USER} -d ${DB_NAME} -c "SELECT 1" >/dev/null
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
    secrets:
      - db_password
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: budgets_redis_prod
    restart: unless-stopped
    command: >
      /bin/sh -c "REDIS_PASS=$(cat /run/secrets/redis_password) &&
      exec redis-server --appendonly yes --requirepass $$REDIS_PASS --maxmemory 256mb --maxmemory-policy allkeys-lru"
    volumes:
      - redis_data:/data
    networks:
      - budgets_network
    healthcheck:
      test:
        - CMD-SHELL
        - |
          REDIS_PASS=$(cat /run/secrets/redis_password) && redis-cli -a "$REDIS_PASS" ping
      interval: 30s
      timeout: 10s
      retries: 5
    secrets:
      - redis_password
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Django Application
  web:
    build: .
    container_name: budgets_web_prod
    restart: unless-stopped
    environment:
      - DEBUG=False
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_DEFAULT_NAME=${DB_NAME}
      - DATABASE_DEFAULT_USER=${DB_USER}
      - DATABASE_DEFAULT_HOST=db
      - DATABASE_DEFAULT_PORT=5432
      - SECRET_KEY_FILE=/run/secrets/django_secret_key
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - EMAIL_BACKEND=${EMAIL_BACKEND}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - budgets_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    secrets:
      - db_password
      - redis_password
      - django_secret_key
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
      # Note: replicas only work with Docker Swarm
      # For single host, remove replicas or use docker-compose up --scale web=2
      # replicas: 2

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: budgets_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    networks:
      - budgets_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Celery Worker for background tasks
  celery:
    build: .
    container_name: budgets_celery_prod
    restart: unless-stopped
    command: celery -A BudgetsSystem worker -l info --concurrency=2
    environment:
      - DEBUG=False
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_DEFAULT_NAME=${DB_NAME}
      - DATABASE_DEFAULT_USER=${DB_USER}
      - DATABASE_DEFAULT_HOST=db
      - DATABASE_DEFAULT_PORT=5432
      - SECRET_KEY_FILE=/run/secrets/django_secret_key
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - budgets_network
    secrets:
      - db_password
      - redis_password
      - django_secret_key
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Celery Beat for scheduled tasks
  celery-beat:
    build: .
    container_name: budgets_celery_beat_prod
    restart: unless-stopped
    command: celery -A BudgetsSystem beat -l info
    environment:
      - DEBUG=False
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_DEFAULT_NAME=${DB_NAME}
      - DATABASE_DEFAULT_USER=${DB_USER}
      - DATABASE_DEFAULT_HOST=db
      - DATABASE_DEFAULT_PORT=5432
      - SECRET_KEY_FILE=/run/secrets/django_secret_key
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - budgets_network
    secrets:
      - db_password
      - redis_password
      - django_secret_key
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Backup service (commented out - requires django-dbbackup configuration)
  # Uncomment and configure if you have django-dbbackup set up
  # backup:
  #   build: .
  #   container_name: budgets_backup_prod
  #   restart: "no"
  #   command: python manage.py dbbackup --compress
  #   environment:
  #     - DEBUG=False
  #     - SECRET_KEY=${SECRET_KEY}
  #     - DB_NAME=${DB_NAME}
  #     - DB_USER=${DB_USER}
  #     - DB_PASSWORD=${DB_PASSWORD}
  #     - DB_HOST=db
  #     - DB_PORT=5432
  #     - BACKUP_ENABLED=True
  #   volumes:
  #     - ./backups:/backups
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - budgets_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  budgets_network:
    driver: bridge

secrets:
  db_password:
    file: ${DB_PASSWORD_SECRET_FILE:-./secrets/db_password.txt}
  redis_password:
    file: ${REDIS_PASSWORD_SECRET_FILE:-./secrets/redis_password.txt}
  django_secret_key:
    file: ${SECRET_KEY_FILE_PATH:-./secrets/django_secret_key.txt}
