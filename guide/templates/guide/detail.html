{% extends 'base.html' %} {% load static %} {% block extra_head %}
<!-- Highlight.js CSS - Local -->
<link rel="stylesheet" href="{% static 'admin/css/github-dark.min.css' %}" />


<style>
  .markdown-content {
    line-height: 1.8;
    font-family: "Vazir", "Tahoma", sans-serif;
    color: #333;
  }
  .markdown-content h1,
  .markdown-content h2,
  .markdown-content h3,
  .markdown-content h4 {
    margin-top: 2rem;
    margin-bottom: 1rem;
    color: #2c3e50;
    font-weight: bold;
  }
  .markdown-content h1 {
    border-bottom: 2px solid #eee;
    padding-bottom: 0.5rem;
    font-size: 2rem;
  }
  .markdown-content h2 {
    border-bottom: 1px solid #eee;
    padding-bottom: 0.5rem;
    font-size: 1.75rem;
  }
  .markdown-content h3 {
    font-size: 1.5rem;
  }

  .markdown-content p {
    margin-bottom: 1rem;
    text-align: justify;
  }

  .markdown-content code {
    background-color: #f1f3f5;
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
    color: #d63384;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 0.9em;
  }

  .markdown-content pre {
    background-color: #282c34;
    padding: 1rem;
    border-radius: 8px;
    overflow-x: auto;
    margin: 1.5rem 0;
    direction: ltr;
    text-align: left;
  }
  .markdown-content pre code {
    background-color: transparent;
    color: inherit;
    padding: 0;
    font-size: 0.95em;
  }

  .markdown-content blockquote {
    border-right: 5px solid #0d6efd;
    background-color: #f8f9fa;
    padding: 1rem 1.5rem;
    margin: 1.5rem 0;
    color: #495057;
    font-style: italic;
    border-radius: 4px;
  }

  .markdown-content ul,
  .markdown-content ol {
    padding-right: 2rem;
    margin-bottom: 1rem;
  }
  .markdown-content li {
    margin-bottom: 0.5rem;
  }

  .markdown-content table {
    width: 100%;
    margin: 1.5rem 0;
    border-collapse: collapse;
    font-size: 0.95rem;
  }
  .markdown-content th,
  .markdown-content td {
    border: 1px solid #dee2e6;
    padding: 0.75rem;
    text-align: right;
  }
  .markdown-content th {
    background-color: #e9ecef;
    font-weight: bold;
  }

  .markdown-content img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin: 1.5rem auto;
    display: block;
  }

  .markdown-content hr {
    margin: 2rem 0;
    border: 0;
    border-top: 1px solid #dee2e6;
  }

  .markdown-content a {
    color: #0d6efd;
    text-decoration: none;
  }
  .markdown-content a:hover {
    text-decoration: underline;
  }
</style>
{% endblock %} {% block content %}
<div class="container mt-4 mb-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <a href="{% url 'guide:index' %}" class="btn btn-outline-secondary">
      <i class="fas fa-arrow-right me-1"></i> بازگشت به فهرست
    </a>
    <h1 class="h5 text-muted mb-0">نمایش مستندات</h1>
  </div>

  <div class="card shadow-lg border-0">
    <div class="card-header bg-white border-bottom py-3">
      <h1 class="h3 mb-0 text-primary fw-bold">{{ title }}</h1>
    </div>
    <div class="card-body p-4 p-md-5">
      <div id="content" class="markdown-content">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2 text-muted">در حال بارگذاری و پردازش متن...</p>
        </div>
      </div>

      <!-- Hidden raw content - using JSON encoding to preserve special characters -->
      <script type="application/json" id="raw-content">{{ content|escapejs }}</script>
    </div>
  </div>
</div>

<script>
  // This will be called after scripts are loaded (see waitForScripts below)

  function processMarkdown(rawContent, contentDiv) {
    // Check if marked library is loaded
    if (typeof marked === 'undefined') {
      console.error("Marked.js library is not loaded!");
      contentDiv.innerHTML = `
        <div class='alert alert-danger'>
          <h4 class='alert-heading'>خطا در بارگذاری کتابخانه!</h4>
          <p>کتابخانه Marked.js بارگذاری نشده است.</p>
        </div>
        <pre class='bg-light p-3 border rounded' style='white-space: pre-wrap;'>${rawContent}</pre>
      `;
      return;
    }

    // Configure marked options
    try {
      // Check if marked.setOptions exists (for newer versions)
      if (typeof marked.setOptions === 'function') {
        marked.setOptions({
          gfm: true,
          breaks: true,
          headerIds: true,
          mangle: false,
          langPrefix: 'hljs language-',
        });
      } else if (typeof marked.use === 'function') {
        // For marked v12+
        marked.use({
          gfm: true,
          breaks: true,
          headerIds: true,
          mangle: false,
        });
      }
    } catch (e) {
      console.warn("Could not set marked options:", e);
    }

    try {
      // Parse Markdown (URLs already converted in backend)
      let htmlContent;
      if (typeof marked.parse === 'function') {
        htmlContent = marked.parse(rawContent);
      } else if (typeof marked === 'function') {
        // Fallback for older versions
        htmlContent = marked(rawContent);
      } else {
        throw new Error('marked.parse is not available');
      }

      if (!htmlContent || htmlContent.trim() === '') {
        contentDiv.innerHTML = '<div class="alert alert-warning">فایل خالی است یا محتوایی ندارد.</div>';
        return;
      }

      contentDiv.innerHTML = htmlContent;

      // Apply syntax highlighting if hljs is available
      // Wait a bit for hljs to load
      setTimeout(function() {
        if (typeof hljs !== 'undefined' && typeof hljs.highlightElement === 'function') {
          document.querySelectorAll("pre code").forEach((block) => {
            try {
              hljs.highlightElement(block);
            } catch (e) {
              console.warn("Error highlighting code block:", e);
            }
          });
        }
      }, 500);

      // Add Bootstrap table classes
      document.querySelectorAll("table").forEach((table) => {
        table.classList.add(
          "table",
          "table-striped",
          "table-hover",
          "table-bordered"
        );
      });

      // Remove loading spinner
      const spinner = contentDiv.querySelector('.spinner-border');
      if (spinner && spinner.parentElement) {
        spinner.parentElement.remove();
      }

    } catch (e) {
      console.error("Error parsing markdown:", e);
      contentDiv.innerHTML = `
        <div class='alert alert-danger'>
          <h4 class='alert-heading'>خطا در نمایش محتوا!</h4>
          <p>متاسفانه مشکلی در پردازش فایل مارک‌داون پیش آمده است.</p>
          <p class='small text-muted'>${e.message}</p>
        </div>
        <div class='mt-3'>
          <h5>محتوای خام:</h5>
          <pre class='bg-light p-3 border rounded' style='white-space: pre-wrap; direction: ltr; text-align: left; max-height: 500px; overflow-y: auto;'>${rawContent.substring(0, 2000)}${rawContent.length > 2000 ? '\n\n... (متن کامل در فایل اصلی موجود است)' : ''}</pre>
        </div>
      `;
    }
  }

  // Wait for scripts to load before processing
  function waitForScripts(callback, maxAttempts, attempt) {
    maxAttempts = maxAttempts || 50;
    attempt = attempt || 0;

    if (typeof marked !== 'undefined') {
      // marked.js is loaded, hljs is optional
      callback();
    } else if (attempt >= maxAttempts) {
      console.error('Timeout waiting for marked.js to load');
      const contentDiv = document.getElementById("content");
      if (contentDiv) {
        const rawContentElement = document.getElementById("raw-content");
        const rawContent = rawContentElement ? (rawContentElement.textContent || rawContentElement.innerText) : '';
        contentDiv.innerHTML = `
          <div class='alert alert-danger'>
            <h4 class='alert-heading'>خطا در بارگذاری کتابخانه!</h4>
            <p>کتابخانه Marked.js بارگذاری نشد.</p>
            <ul class='mt-2'>
              <li>marked.js: ✗ (بارگذاری نشد)</li>
              <li>hljs: ${typeof hljs !== 'undefined' ? '✓' : '✗'}</li>
            </ul>
            <p class='mt-2 small'><strong>راه‌حل:</strong></p>
            <ol class='small'>
              <li>بررسی کنید که فایل <code>static/admin/js/marked.min.js</code> وجود دارد</li>
              <li>بررسی کنید که Django static files به درستی تنظیم شده است</li>
              <li>Console مرورگر را برای خطاهای بیشتر بررسی کنید</li>
            </ol>
            <details class='mt-3'>
              <summary class='btn btn-sm btn-outline-secondary'>نمایش محتوای خام</summary>
              <pre class='bg-light p-3 border rounded mt-2' style='white-space: pre-wrap; direction: ltr; text-align: left; max-height: 300px; overflow-y: auto;'>${rawContent.substring(0, 1000)}${rawContent.length > 1000 ? '\n\n... (متن کامل در فایل اصلی موجود است)' : ''}</pre>
            </details>
          </div>
        `;
      }
    } else {
      setTimeout(function() {
        waitForScripts(callback, maxAttempts, attempt + 1);
      }, 100);
    }
  }

  // Wait for DOM and scripts to be ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      waitForScripts(processContent);
    });
  } else {
    // DOM is already ready
    waitForScripts(processContent);
  }

  function processContent() {
    console.log('Processing markdown content...');
    const rawContentElement = document.getElementById("raw-content");
    const contentDiv = document.getElementById("content");

    if (!rawContentElement || !contentDiv) {
      console.error('Content elements not found');
      return;
    }

    // Get content from JSON script tag
    let rawContent = rawContentElement.textContent || rawContentElement.innerText;

    if (!rawContent || rawContent.trim() === '') {
      contentDiv.innerHTML = '<div class="alert alert-warning">فایل خالی است یا محتوایی ندارد.</div>';
      return;
    }

    // Process markdown
    processMarkdown(rawContent, contentDiv);
  }
</script>

<!-- Marked.js and Highlight.js - Loaded at end of body -->
<script src="{% static 'admin/js/marked.min.js' %}"></script>
<script src="{% static 'admin/js/highlight.min.js' %}"></script>

<script>
  // Initialize after scripts are loaded
  (function() {
    // Check if scripts are already loaded
    if (typeof marked !== 'undefined') {
      // Scripts loaded, process immediately
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', processContent);
      } else {
        processContent();
      }
    } else {
      // Wait for scripts to load
      waitForScripts(processContent);
    }
  })();
</script>
{% endblock %}
