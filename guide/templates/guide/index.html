{% extends 'base.html' %} {% load static %} {% block content %}
<div class="container mt-4">
  <div class="card shadow">
    <div
      class="card-header bg-primary text-white d-flex justify-content-between align-items-center"
    >
      <h2 class="mb-0 h4">📚 راهنمای جامع سیستم</h2>
      <span class="badge bg-light text-primary">{{ files|length }} سند</span>
    </div>
    <div class="card-body p-0">
      <div class="list-group list-group-flush">
        {% for file in files %}
        <a
          href="{% url 'guide:detail' file %}"
          class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3"
        >
          <div class="d-flex align-items-center">
            <i class="fas fa-file-alt text-primary me-3 fs-4"></i>
            <span class="fw-bold mx-2">{{ file }}</span>
          </div>
          <i class="fas fa-chevron-left text-muted"></i>
        </a>
        {% empty %}
        <div class="alert alert-warning m-3">
          <i class="fas fa-exclamation-triangle"></i> هیچ فایل مستنداتی در پوشه
          docs یافت نشد.
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
